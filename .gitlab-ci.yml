# Pipeline: test on every push; on a version tag (vX.Y.Z) it packs and publishes to npm. Required CI/CD variables (Settings > CI/CD > Variables, masked):
#   NPM_TOKEN            token for the npm registry (publish)
# To publish to the GitLab package registry instead, set NPM_REGISTRY (see publish_npm).

stages:
  - test
  - package
  - publish

default:
  image: node:22-alpine

test:
  stage: test
  script:
    - npm run install:all
    - npm test

pack:
  stage: package
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+(-[0-9A-Za-z.]+)?$/
  script:
    - test "v$(node -p 'require("./package.json").version')" = "$CI_COMMIT_TAG" || { echo "package.json version does not match tag $CI_COMMIT_TAG"; exit 1; }
    - npm pack
  artifacts:
    paths:
      - issue-timeline-*.tgz
    expire_in: 30 days

publish_npm:
  stage: publish
  needs: [pack]
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+(-[0-9A-Za-z.]+)?$/
  variables:
    # npmjs by default. For the GitLab registry use:
    #   NPM_REGISTRY: ${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/npm/
    # and change the auth line to use CI_JOB_TOKEN (the package name must then be scoped).
    NPM_REGISTRY: https://registry.npmjs.org/
  script:
    - echo "registry=${NPM_REGISTRY}" > .npmrc
    - echo "//$(echo ${NPM_REGISTRY} | sed -E 's#^https?://##')/:_authToken=${NPM_TOKEN}" >> .npmrc
    # Pre-releases (vX.Y.Z-beta.N) go under the "beta" dist-tag, so "latest" keeps the last stable version.
    - case "$CI_COMMIT_TAG" in *-*) npm publish issue-timeline-*.tgz --access public --tag beta ;; *) npm publish issue-timeline-*.tgz --access public ;; esac

# Mirror to GitHub: GitLab is the source of truth, with the full history. GitHub is the public copy and gets a single
# commit: a snapshot of the tree of HEAD with no history behind it. Pushed as the "system4us" GitHub App (see
# scripts/gh-app-token.mjs and README). A version tag is put on that snapshot too.
# Required variables: GH_APP_ID, GH_INSTALLATION_ID, and GH_APP_PRIVATE_KEY (or GH_APP_PRIVATE_KEY_FILE).
mirror_github:
  stage: publish
  needs: [test]
  before_script:
    - apk add --no-cache git
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+(-[0-9A-Za-z.]+)?$/
  script:
    - TOKEN=$(node scripts/gh-app-token.mjs)
    - git remote add github "https://x-access-token:${TOKEN}@github.com/system4us/issue-timeline.git"
    # One commit with no parents: the tree of HEAD, under a neutral identity (no personal email leaves GitLab).
    - export GIT_AUTHOR_NAME="issue-timeline" GIT_AUTHOR_EMAIL="issue-timeline@users.noreply.github.com"
    - export GIT_COMMITTER_NAME="$GIT_AUTHOR_NAME" GIT_COMMITTER_EMAIL="$GIT_AUTHOR_EMAIL"
    - SNAP=$(git commit-tree "HEAD^{tree}" -m "$(git log -1 --format=%s HEAD)")
    - git push --force github "$SNAP:refs/heads/main"
    - |
      if [ -n "$CI_COMMIT_TAG" ]; then
        git tag -f "$CI_COMMIT_TAG" "$SNAP"
        git push --force github "refs/tags/$CI_COMMIT_TAG:refs/tags/$CI_COMMIT_TAG"
      fi
